<!DOCTYPE html>
<html lang="en">
<head>
  <title>ROCK PAPPER SCISSOR GAME</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>
  <h1>Rock Paper Scissor</h1>
  <button onclick="playGame('Rock')" class="btn-move"> <img class="img-move" src="image/rock-emoji.png" alt=""></button>
  <button onclick="playGame('Paper')" class="btn-move"><img class="img-move" src="image/paper-emoji.png" alt=""></button>
  <button onclick="playGame('Scissors')" class="btn-move"><img class="img-move" src="image/Scissors-emoji.png" alt=""></button>
  <p class="result"></p>
  <p class="you-computer"></p>
  <p class="scores"></p>
  <button onclick="resetScores()
  updateScores()" 
  class="btn"
  >Reset Scores</button>
</body>
</html>
